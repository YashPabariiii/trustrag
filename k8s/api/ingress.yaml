apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trustrag
  namespace: trustrag
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"        # matches MAX_FILE_BYTES
    # SSE: the answer streams token by token, so response buffering must be off
    # and the read timeout has to outlive a long generation.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: trustrag.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
