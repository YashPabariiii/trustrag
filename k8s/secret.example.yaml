# TEMPLATE ONLY — copy to k8s/secret.yaml, fill in, and never commit it.
# k8s/secret.yaml is gitignored.
#
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   $EDITOR k8s/secret.yaml
#   kubectl apply -f k8s/secret.yaml
#
# In anything real these values come from a secret manager (External Secrets,
# Vault, SOPS), not from a file a human edits. A plain Secret is base64, not
# encryption — anyone with read access to the namespace can decode it.
apiVersion: v1
kind: Secret
metadata:
  name: trustrag-secrets
  namespace: trustrag
type: Opaque
stringData:
  SECRET_KEY: "CHANGE-ME-openssl-rand-hex-32"
  GROQ_API_KEY: "gsk_CHANGE-ME"
  DATABASE_URL: "postgresql+asyncpg://trustrag:CHANGE-ME@postgres:5432/trustrag"
  POSTGRES_PASSWORD: "CHANGE-ME"
